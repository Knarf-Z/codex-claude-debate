name: Tests

on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check
        run: python -m py_compile scripts/claude_bridge.py
      - name: Verify canonical SHA-256 signoff logic
        run: python -m unittest discover -s tests -v
